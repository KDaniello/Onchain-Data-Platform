[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
# Асинхронный рантайм
tokio = { version = "1", features = ["full"] }

# Работа с базой данных (Postgres)
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid"] }

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Работа со временем
chrono = { version = "0.4", features = ["serde"] }

# Ethereum типы (Alloy)
alloy = { version = "1.3.0", features = ["full"] }

# Логирование
tracing = "0.1"

# Clickhouse
clickhouse = { version = "0.14.1", features = ["time"] }