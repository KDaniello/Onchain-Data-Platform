[package]
name = "finalizer"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../../crates/common" }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "chrono"] }
clickhouse = "0.14.1"
dotenv = "0.15"