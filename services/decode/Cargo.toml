[package]
name = "decode"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../../crates/common" }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clickhouse = { version = "0.14.1", features = ["time"] }
alloy = { version = "1.3", features = ["full"] }
serde = "1.0"
chrono = "0.4"
hex = "0.4"