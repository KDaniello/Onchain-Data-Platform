global:
  scrape_interval: 5s # Собирать метрики каждые 5 секунд

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ingest-service'
    static_configs:
      # 172.17.0.1 - это стандартный IP хоста изнутри Docker контейнера на Linux.
      # Если не заработает, попробуем host.docker.internal
      - targets: ['host.docker.internal:9091']