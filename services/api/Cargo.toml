[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../../crates/common" }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
dotenv = "0.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web Framework
axum = "0.8.8"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.8", features = ["trace", "cors"] }

# Data
clickhouse = { version = "0.14.1", features = ["time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "chrono"] }

# Metrics
metrics = "0.24.3"